---
name: Release Connect Sidecar
# The workflow builds connect from docker/connect-sidecar/Dockerfile, pushes
# the image to Docker Hub, and attaches the linux-amd64 binary to a GitHub
# release. The tag must be connect-sidecar-<connect version>-<go version>,
# e.g. connect-sidecar-v2.1.2-go1.26.10, and must match the Dockerfile.
on:
  push:
    tags:
      - 'connect-sidecar-v*'

env:
  REGISTRY: docker.io/mezo/connect-sidecar

jobs:
  release:
    # Required to create a release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 🏧 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏭 Build binaries
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target binaries \
            --output type=local,dest=out \
            docker/connect-sidecar

      - name: 👁️ Check if the tag matches the build
        id: version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          build_tag="$(cat out/build-tag)"
          if [ "connect-sidecar-${build_tag}" != "${GIT_TAG}" ]; then
            echo "Tag ${GIT_TAG} does not match the build (connect-sidecar-${build_tag})"
            exit 1
          fi
          echo "image_tag=${build_tag}" >> "$GITHUB_OUTPUT"
          echo "archive=connect-${build_tag#v}-linux-amd64" >> "$GITHUB_OUTPUT"

      - name: 📦 Archive binary
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          mkdir "${ARCHIVE}"
          cp out/connect "${ARCHIVE}/"
          tar -czvf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.sha256"

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker/connect-sidecar
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}:${{ steps.version.outputs.image_tag }}

      - name: 🚀 Release
        uses: softprops/action-gh-release@v2
        with:
          # Keeps the Helm chart release as the latest release
          make_latest: false
          files: |
            ${{ steps.version.outputs.archive }}.tar.gz
            ${{ steps.version.outputs.archive }}.sha256
